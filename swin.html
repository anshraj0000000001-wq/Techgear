<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swin Transformer Window Attention (W-MSA) Visualizer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: 'rgba(17, 24, 39, 0.7)',
                        glassBorder: 'rgba(255, 255, 255, 0.1)',
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #020617; font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        .step-item.active {
            background: rgba(56, 189, 248, 0.15);
            border-left: 4px solid #38bdf8;
            color: #fff;
        }

        #code-block pre { margin: 0; }
        
        .glow-text { text-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }
    </style>
</head>
<body class="text-gray-300 h-screen flex flex-col">

    <!-- Header -->
    <header class="glass-panel h-16 flex items-center justify-between px-6 z-20 shrink-0">
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-network-wired text-sky-400 text-2xl"></i>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide glow-text">W-MSA Visualizer</h1>
                <p class="text-xs text-sky-200 opacity-80">Swin Transformer Window Attention Debugger</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex bg-slate-800/50 rounded-lg p-1 border border-slate-700">
                <button id="btn-prev" class="px-4 py-1.5 hover:bg-slate-700 rounded transition-colors" title="Previous Step">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button id="btn-play" class="px-4 py-1.5 hover:bg-slate-700 rounded text-sky-400 transition-colors w-12" title="Play/Pause">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button id="btn-next" class="px-4 py-1.5 hover:bg-slate-700 rounded transition-colors" title="Next Step">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>
            <div class="flex items-center gap-2 text-sm">
                <i class="fa-solid fa-gauge-high text-gray-400"></i>
                <input type="range" id="speed-slider" min="0.5" max="3" step="0.1" value="1" class="w-24 accent-sky-400">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- Sidebar Steps -->
        <aside class="w-64 glass-panel border-t-0 border-b-0 border-l-0 z-10 flex flex-col shrink-0">
            <div class="p-4 border-b border-white/10">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Execution Pipeline</h2>
            </div>
            <div id="steps-container" class="flex-1 overflow-y-auto py-2">
                <!-- Steps injected via JS -->
            </div>
        </aside>

        <!-- Visualization Area -->
        <div class="flex-1 flex flex-col relative">
            
            <!-- Three.js Canvas Container -->
            <div id="canvas-container" class="flex-1 relative cursor-move">
                <div class="absolute top-4 left-4 z-10 glass-panel px-4 py-2 rounded-lg flex flex-col gap-1 pointer-events-none">
                    <span class="text-xs text-gray-400 uppercase tracking-wider">3D Tensor View</span>
                    <span class="text-sm font-medium text-white" id="viz-label">Initializing...</span>
                </div>
                <div class="absolute bottom-4 right-4 z-10 pointer-events-none opacity-50 text-xs text-white">
                    <i class="fa-solid fa-mouse"></i> Drag to rotate | Scroll to zoom
                </div>
            </div>

            <!-- Bottom Info Dashboard -->
            <div class="h-64 glass-panel border-r-0 border-b-0 border-l-0 z-10 grid grid-cols-3 gap-0 shrink-0">
                
                <!-- Shape Inspector -->
                <div class="p-5 border-r border-white/10 flex flex-col relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-10 text-6xl"><i class="fa-solid fa-cube"></i></div>
                    <h3 class="text-sm font-bold text-sky-400 mb-4 uppercase flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass-chart"></i> Tensor Inspector
                    </h3>
                    <div class="flex-1 flex flex-col justify-center space-y-4">
                        <div class="bg-slate-800/40 p-3 rounded border border-slate-700 relative overflow-hidden group">
                            <span class="text-xs text-gray-400 block mb-1">Input Shape</span>
                            <code class="text-md text-emerald-400 font-mono block" id="info-input">...</code>
                            <div class="absolute inset-0 bg-emerald-400/5 translate-y-full group-hover:translate-y-0 transition-transform"></div>
                        </div>
                        <div class="flex justify-center text-gray-500">
                            <i class="fa-solid fa-arrow-down"></i>
                        </div>
                        <div class="bg-slate-800/40 p-3 rounded border border-slate-700 relative overflow-hidden group">
                            <span class="text-xs text-gray-400 block mb-1">Output Shape</span>
                            <code class="text-md text-sky-400 font-mono block" id="info-output">...</code>
                            <div class="absolute inset-0 bg-sky-400/5 translate-y-full group-hover:translate-y-0 transition-transform"></div>
                        </div>
                    </div>
                </div>

                <!-- Code & Math -->
                <div class="p-5 border-r border-white/10 flex flex-col col-span-2 relative">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-sm font-bold text-fuchsia-400 uppercase flex items-center gap-2">
                            <i class="fa-solid fa-code"></i> Operation Logic
                        </h3>
                    </div>
                    <div class="grid grid-cols-2 gap-4 h-full">
                        <div class="bg-slate-900/80 rounded-md border border-slate-700 p-3 font-mono text-sm overflow-x-auto relative shadow-inner">
                            <div class="absolute top-2 right-2 text-xs text-gray-500">PyTorch</div>
                            <pre><code id="info-code" class="text-gray-300"># PyTorch code...</code></pre>
                        </div>
                        <div class="bg-slate-900/80 rounded-md border border-slate-700 p-4 flex items-center justify-center overflow-auto shadow-inner relative">
                            <div class="absolute top-2 left-2 text-xs text-gray-500">Math</div>
                            <div id="info-math" class="text-sm md:text-base w-full text-center">
                                <!-- MathJax injected here -->
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // 1. DATA & PIPELINE DEFINITION
        // ==========================================
        const pipelineSteps = [
            {
                id: 1, title: 'Image Input',
                input: '(B, 224, 224, 3)', output: '(B, 224, 224, 3)',
                code: 'x = image',
                math: '$$X \\in \\mathbb{R}^{B \\times H \\times W \\times C}$$',
                desc: 'Initial RGB Image Tensor. B=1 for visualization.',
                animType: 'create_box', color: 0xcccccc, dims: [10, 10, 0.5], labels: ['224', '224', '3']
            },
            {
                id: 2, title: 'Conv2D Projection',
                input: '(B, 224, 224, 3)', output: '(B, 56, 56, 96)',
                code: 'x = PatchEmbed(x)\n# Conv2D(in=3, out=96, k=4, s=4)',
                math: '$H_{out} = \\frac{224}{4} = 56, W_{out} = 56$',
                desc: 'Patch partition via Convolution. Spatial dims shrink by 4, channel dim increases.',
                animType: 'morph', dims: [6, 6, 3], labels: ['56', '56', '96'], color: 0x0ea5e9
            },
            {
                id: 3, title: 'Window Partition',
                input: '(B, 56, 56, 96)', output: '(B*64, 7, 7, 96)',
                code: 'x = window_partition(x, window_size=7)',
                math: '$$\\text{Num Windows} = \\left(\\frac{56}{7}\\right) \\times \\left(\\frac{56}{7}\\right) = 64$$',
                desc: 'Split feature map into 8x8 non-overlapping windows.',
                animType: 'split_grid', grid: [8, 8], spacing: 0.8
            },
            {
                id: 4, title: 'Flatten Window',
                input: '(64, 7, 7, 96)', output: '(64, 49, 96)',
                code: 'x = x.view(-1, window_size*window_size, C)',
                math: '$$N = 7 \\times 7 = 49$$',
                desc: 'Flatten spatial dimensions inside each window into a sequence of 49 tokens.',
                animType: 'focus_and_flatten', dims: [8, 0.5, 2], labels: ['49', '96', '']
            },
            {
                id: 5, title: 'QKV Projection',
                input: '(64, 49, 96)', output: '(64, 49, 3, 3, 32)',
                code: 'qkv = self.qkv(x).reshape(B_, N, 3, num_heads, C // num_heads)',
                math: '$$XW_{qkv} \\in \\mathbb{R}^{49 \\times 288}$$<br>$288 \\rightarrow 3 \\times 3 \\times 32$',
                desc: 'Linear projection to get Query, Key, Value. Split into 3 heads of dim 32.',
                animType: 'morph_and_split_depth', dims: [8, 0.5, 6], splits: 3, color: 0xa855f7
            },
            {
                id: 6, title: 'Permute Operation',
                input: '(64, 49, 3, 3, 32)', output: '(3, 64, 3, 49, 32)',
                code: 'qkv = qkv.permute(2, 0, 3, 1, 4)',
                math: '$$\\text{Axes: } (N, 3, h, d) \\rightarrow (3, h, N, d)$$',
                desc: 'Reorder dimensions to process heads and tokens efficiently.',
                animType: 'rotate_axes'
            },
            {
                id: 7, title: 'Split Q K V',
                input: '(3, 64, 3, 49, 32)', output: 'Q, K, V: (64, 3, 49, 32)',
                code: 'q, k, v = qkv[0], qkv[1], qkv[2]',
                math: '$$Q, K, V \\text{ separate}$$',
                desc: 'Separate the QKV tensor into independent Query, Key, and Value tensors.',
                animType: 'separate_qkv', colors: [0xef4444, 0x22c55e, 0x3b82f6]
            },
            {
                id: 8, title: 'Attention Scaling',
                input: 'Q: (64, 3, 49, 32)', output: 'Q: (64, 3, 49, 32)',
                code: 'q = q * self.scale',
                math: '$$Q_{scaled} = \\frac{Q}{\\sqrt{d_k}} = \\frac{Q}{\\sqrt{32}}$$',
                desc: 'Scale Queries to prevent vanishing gradients in softmax.',
                animType: 'pulse_q'
            },
            {
                id: 9, title: 'Attention Matrix',
                input: 'Q, K', output: '(64, 3, 49, 49)',
                code: 'attn = (q @ k.transpose(-2, -1))',
                math: '$$Attn = QK^T \\in \\mathbb{R}^{49 \\times 49}$$',
                desc: 'Matrix multiplication of Q and transposed K to compute token similarities.',
                animType: 'matmul_attn', dims: [5, 5, 0.1], color: 0xf59e0b
            },
            {
                id: 10, title: 'Rel Pos Bias Table',
                input: 'Window Size = 7', output: '(13x13, 3)',
                code: 'self.relative_position_bias_table # (2M-1)*(2M-1), nH',
                math: '$$(2 \\times 7 - 1)^2 = 13 \\times 13 = 169$$',
                desc: 'Learnable bias table representing all possible relative distances.',
                animType: 'show_bias_table', grid: [13, 13]
            },
            {
                id: 11, title: 'Relative Bias Lookup',
                input: 'Index: (49, 49)', output: '(49, 49, 3)',
                code: 'relative_position_bias = self.relative_position_bias_table[\n  self.relative_position_index.view(-1)\n].view(N, N, -1)',
                math: '$$B_{ij} = \\text{Table}[\\text{Index}_{ij}]$$',
                desc: 'Retrieve learned bias values based on relative coordinates of token pairs.',
                animType: 'lookup_bias'
            },
            {
                id: 12, title: 'Bias Permutation',
                input: '(49, 49, 3)', output: '(3, 49, 49)',
                code: 'relative_position_bias = relative_position_bias.permute(2, 0, 1).contiguous()',
                math: '$$\\mathbb{R}^{49 \\times 49 \\times 3} \\rightarrow \\mathbb{R}^{3 \\times 49 \\times 49}$$',
                desc: 'Permute to match the shape of the attention matrix heads.',
                animType: 'rotate_bias'
            },
            {
                id: 13, title: 'Add Bias To Attention',
                input: 'Attn, Bias', output: '(64, 3, 49, 49)',
                code: 'attn = attn + relative_position_bias.unsqueeze(0)',
                math: '$$Attn = QK^T + B$$',
                desc: 'Inject geometric inductive bias into the attention matrix.',
                animType: 'merge_bias_attn'
            },
            {
                id: 14, title: 'Shifted Window Mask',
                input: 'Attn, Mask', output: '(64, 3, 49, 49)',
                code: 'if mask is not None:\n  attn = attn.view(B_//nW, nW, self.num_heads, N, N) + mask\n  attn = attn.view(-1, self.num_heads, N, N)',
                math: '$$Attn = Attn + Mask$$ (adds $-\\infty$ to non-adjacent tokens)',
                desc: 'Apply mask for SW-MSA to prevent interaction across original window boundaries.',
                animType: 'apply_mask'
            },
            {
                id: 15, title: 'Softmax',
                input: '(64, 3, 49, 49)', output: '(64, 3, 49, 49)',
                code: 'attn = attn.softmax(dim=-1)',
                math: '$$P_{ij} = \\frac{\\exp(A_{ij})}{\\sum_k \\exp(A_{ik})}$$',
                desc: 'Normalize attention scores into probability distributions.',
                animType: 'softmax_normalize'
            },
            {
                id: 16, title: 'Attention × V',
                input: 'Attn, V', output: '(64, 3, 49, 32)',
                code: 'x = (attn @ v)',
                math: '$$Out = \\text{Softmax}(QK^T + B)V$$',
                desc: 'Weight the Value vectors by the attention probabilities.',
                animType: 'matmul_v'
            },
            {
                id: 17, title: 'Transpose',
                input: '(64, 3, 49, 32)', output: '(64, 49, 3, 32)',
                code: 'x = x.transpose(1, 2)',
                math: '$$\\text{Axes: } (B, h, N, d) \\rightarrow (B, N, h, d)$$',
                desc: 'Prepare to concatenate the multiple attention heads.',
                animType: 'transpose_out'
            },
            {
                id: 18, title: 'Reshape',
                input: '(64, 49, 3, 32)', output: '(64, 49, 96)',
                code: 'x = x.reshape(B_, N, C)',
                math: '$$3 \\times 32 = 96$$',
                desc: 'Merge multi-head outputs back into original embedding dimension.',
                animType: 'merge_heads'
            },
            {
                id: 19, title: 'Output Projection',
                input: '(64, 49, 96)', output: '(64, 49, 96)',
                code: 'x = self.proj(x)',
                math: '$$Out = XW_O$$',
                desc: 'Final linear projection mixing features across heads.',
                animType: 'pulse_out'
            },
            {
                id: 20, title: 'Window Merge',
                input: '(64, 49, 96)', output: '(B, 56, 56, 96)',
                code: 'x = x.view(-1, 7, 7, 96)\nx = window_reverse(x, window_size=7, H=56, W=56)',
                math: '$$64 \\times 7 \\times 7 \\rightarrow 56 \\times 56$$',
                desc: 'Reassemble 64 disjoint windows back into the full spatial feature map.',
                animType: 'merge_windows'
            }
        ];

        // ==========================================
        // 2. THREE.JS SETUP & ENGINE
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(15, 15, 20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        let activeObjects = [];
        let currentTimeline = null;
        let animationSpeed = 1.0;

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Render loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Helpers
        function clearScene() {
            activeObjects.forEach(obj => {
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
            });
            activeObjects = [];
        }

        function createBox(w, h, d, color, opacity = 0.8) {
            const geometry = new THREE.BoxGeometry(w, h, d);
            const material = new THREE.MeshPhysicalMaterial({
                color: color,
                transparent: true,
                opacity: opacity,
                roughness: 0.2,
                metalness: 0.1,
                transmission: 0.1,
            });
            const mesh = new THREE.Mesh(geometry, material);
            
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
            mesh.add(line);
            
            return mesh;
        }

        function createLabel(text, size = 1, color = '#ffffff') {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 64;
            context.fillStyle = 'rgba(0,0,0,0)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.font = 'bold 36px monospace';
            context.fillStyle = color;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, canvas.width/2, canvas.height/2);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(size*4, size, 1);
            return sprite;
        }

        // ==========================================
        // 3. ANIMATION ENGINE
        // ==========================================
        
        // Cache objects to reuse between some steps to make transitions fluid
        let persistentState = {}; 

        function runAnimation(stepInfo) {
            if (currentTimeline) currentTimeline.kill();
            clearScene();
            currentTimeline = gsap.timeline({ timeScale: animationSpeed });

            // Default Camera Reset
            gsap.to(camera.position, {x: 15, y: 15, z: 20, duration: 1, ease: "power2.inOut"});
            controls.target.set(0,0,0);

            const type = stepInfo.animType;
            
            if (type === 'create_box') {
                const box = createBox(stepInfo.dims[0], stepInfo.dims[1], stepInfo.dims[2], stepInfo.color);
                box.scale.set(0,0,0);
                scene.add(box);
                activeObjects.push(box);
                persistentState.mainBox = box;

                currentTimeline.to(box.scale, {x: 1, y: 1, z: 1, duration: 1, ease: "back.out(1.7)"});
                
                // Add axis labels
                const lbl = createLabel(`Shape: ${stepInfo.input}`, 1.5, '#38bdf8');
                lbl.position.y = 6;
                scene.add(lbl);
                activeObjects.push(lbl);
            } 
            else if (type === 'morph') {
                const box = createBox(10, 10, 0.5, 0xcccccc); // Starting state
                scene.add(box);
                activeObjects.push(box);
                
                currentTimeline.to(box.scale, {
                    x: stepInfo.dims[0]/10, 
                    y: stepInfo.dims[1]/10, 
                    z: stepInfo.dims[2]/0.5, 
                    duration: 1.5, ease: "power2.inOut"
                })
                .to(box.material.color, { r: 0.05, g: 0.65, b: 0.9, duration: 0.5 }, "<");
            }
            else if (type === 'split_grid') {
                const group = new THREE.Group();
                scene.add(group);
                activeObjects.push(group);
                
                const boxW = 6/8; const boxH = 6/8; const boxD = 3;
                const offset = 6 / 2 - boxW/2;

                const boxes = [];
                for(let i=0; i<8; i++) {
                    for(let j=0; j<8; j++) {
                        const box = createBox(boxW*0.9, boxH*0.9, boxD, 0x0ea5e9);
                        // start tightly packed
                        box.position.set(i*boxW - offset, j*boxH - offset, 0);
                        group.add(box);
                        boxes.push({mesh: box, ix: i, iy: j});
                    }
                }

                currentTimeline.to(camera.position, {x: 0, y: 0, z: 20, duration: 1}, 0);
                
                // Animate separation
                boxes.forEach(b => {
                    const tarX = b.ix * (boxW * 1.2) - (8 * boxW * 1.2)/2;
                    const tarY = b.iy * (boxH * 1.2) - (8 * boxH * 1.2)/2;
                    currentTimeline.to(b.mesh.position, {x: tarX, y: tarY, duration: 1, ease: "power2.out"}, 0.5);
                });
            }
            else if (type === 'focus_and_flatten') {
                const box = createBox(3, 3, 3, 0x0ea5e9);
                scene.add(box);
                activeObjects.push(box);

                currentTimeline.to(box.scale, {x: 8/3, y: 0.5/3, z: 2/3, duration: 1.5, ease: "power3.inOut"});
                
                const lbl = createLabel("N=49, C=96", 1.2, '#10b981');
                lbl.position.y = 2;
                scene.add(lbl);
                activeObjects.push(lbl);
            }
            else if (type === 'morph_and_split_depth') {
                const group = new THREE.Group();
                scene.add(group);
                activeObjects.push(group);

                const q = createBox(8, 0.5, 2, 0xef4444); q.position.z = -2.2;
                const k = createBox(8, 0.5, 2, 0x22c55e); k.position.z = 0;
                const v = createBox(8, 0.5, 2, 0x3b82f6); v.position.z = 2.2;
                
                [q,k,v].forEach(b => {
                    b.scale.x = 0.1;
                    group.add(b);
                });

                currentTimeline.to([q.scale, k.scale, v.scale], {x: 1, duration: 1.5, ease:"power2.out"})
                               .to(group.rotation, {x: 0.5, y: -0.5, duration: 1.5}, 0);
            }
            else if (type === 'rotate_axes' || type === 'transpose_out') {
                const box = createBox(6, 2, 4, 0xa855f7);
                scene.add(box);
                activeObjects.push(box);

                currentTimeline.to(box.rotation, {x: Math.PI/2, y: Math.PI/2, duration: 1.5, ease:"back.inOut(1.5)"});
            }
            else if (type === 'separate_qkv') {
                const q = createBox(6, 0.5, 2, 0xef4444);
                const k = createBox(6, 0.5, 2, 0x22c55e);
                const v = createBox(6, 0.5, 2, 0x3b82f6);
                
                scene.add(q); scene.add(k); scene.add(v);
                activeObjects.push(q, k, v);

                currentTimeline.to(q.position, {y: 3, duration: 1}, 0)
                               .to(v.position, {y: -3, duration: 1}, 0)
                               .to(camera.position, {x: 10, y: 0, z: 15, duration: 1}, 0);
            }
            else if (type === 'pulse_q') {
                const q = createBox(6, 0.5, 2, 0xef4444);
                scene.add(q); activeObjects.push(q);
                
                currentTimeline.to(q.scale, {x: 1.1, y: 1.1, z: 1.1, duration: 0.4, yoyo: true, repeat: 3})
                               .to(q.material, {opacity: 0.5, duration: 1}, 0);
            }
            else if (type === 'matmul_attn') {
                const q = createBox(1, 6, 2, 0xef4444); q.position.x = -4;
                const k = createBox(6, 1, 2, 0x22c55e); k.position.x = 4;
                const attn = createBox(6, 6, 0.1, 0xf59e0b, 0); attn.position.z = -2;

                scene.add(q, k, attn);
                activeObjects.push(q, k, attn);

                currentTimeline.to([q.position, k.position], {x: 0, z: -2, duration: 1.5, ease:"power2.in"})
                               .to([q.material, k.material], {opacity: 0, duration: 0.5}, ">-0.5")
                               .to(attn.material, {opacity: 1, duration: 0.5}, "<");
            }
            else if (type === 'show_bias_table') {
                const group = new THREE.Group();
                scene.add(group);
                activeObjects.push(group);
                
                for(let i=0; i<13; i++){
                    for(let j=0; j<13; j++){
                        const b = createBox(0.4, 0.4, 0.1, 0xec4899);
                        b.position.set(i*0.5 - 3, j*0.5 - 3, 0);
                        b.scale.set(0,0,0);
                        group.add(b);
                        currentTimeline.to(b.scale, {x:1, y:1, z:1, duration: 0.2}, (i+j)*0.02);
                    }
                }
            }
            else if (type === 'lookup_bias' || type === 'rotate_bias' || type === 'merge_bias_attn' || type === 'apply_mask') {
                // Simplified abstract representation for specific math tensor merges
                const base = createBox(6, 6, 0.1, 0xf59e0b);
                const layer = createBox(6, 6, 0.1, 0xec4899);
                layer.position.z = 2;
                
                scene.add(base, layer);
                activeObjects.push(base, layer);

                currentTimeline.to(layer.position, {z: 0.1, duration: 1, ease: "power2.inOut"})
                               .to(layer.material, {opacity: 0.5, duration: 0.5}, ">");
            }
            else if (type === 'softmax_normalize') {
                const group = new THREE.Group();
                scene.add(group);
                activeObjects.push(group);
                
                for(let i=0; i<7; i++){
                    for(let j=0; j<7; j++){
                        const b = createBox(0.8, 0.8, 0.1, 0xf59e0b);
                        b.position.set(i*0.9 - 2.7, j*0.9 - 2.7, 0);
                        group.add(b);
                        // Simulate colors shifting to normalize
                        currentTimeline.to(b.material.color, {r: 1, g: Math.random(), b: 0, duration: 1}, 0);
                    }
                }
            }
            else if (type === 'matmul_v') {
                const attn = createBox(6, 6, 0.1, 0xf59e0b); attn.position.x = -4;
                const v = createBox(6, 0.5, 2, 0x3b82f6); v.position.x = 4;
                const out = createBox(6, 0.5, 2, 0xa855f7, 0); out.position.z = -2;

                scene.add(attn, v, out);
                activeObjects.push(attn, v, out);

                currentTimeline.to([attn.position, v.position], {x: 0, z: -2, duration: 1.5})
                               .to([attn.material, v.material], {opacity: 0, duration: 0.5}, ">-0.5")
                               .to(out.material, {opacity: 1, duration: 0.5}, "<");
            }
            else if (type === 'merge_heads' || type === 'pulse_out') {
                const out = createBox(8, 0.5, 6, 0xa855f7);
                scene.add(out); activeObjects.push(out);
                
                currentTimeline.to(out.scale, {x: 1.05, z: 1.05, duration: 0.5, yoyo: true, repeat: 1})
                               .to(out.material.color, {r: 0.2, g: 0.8, b: 0.8, duration: 1}, 0);
            }
            else if (type === 'merge_windows') {
                const group = new THREE.Group();
                scene.add(group);
                activeObjects.push(group);
                
                const boxW = 6/8; const boxH = 6/8; const boxD = 3;
                const offset = 6 / 2 - boxW/2;

                const boxes = [];
                for(let i=0; i<8; i++) {
                    for(let j=0; j<8; j++) {
                        const box = createBox(boxW*0.9, boxH*0.9, boxD, 0x0ea5e9);
                        // start separated
                        box.position.set(i * (boxW * 1.5) - (8 * boxW * 1.5)/2, j * (boxH * 1.5) - (8 * boxH * 1.5)/2, 0);
                        group.add(box);
                        boxes.push({mesh: box, ix: i, iy: j});
                    }
                }

                // Merge into single feature map
                boxes.forEach(b => {
                    const tarX = b.ix * boxW - offset;
                    const tarY = b.iy * boxH - offset;
                    currentTimeline.to(b.mesh.position, {x: tarX, y: tarY, duration: 1.5, ease: "power3.inOut"}, 0);
                    currentTimeline.to(b.mesh.scale, {x: 1.11, y: 1.11, duration: 1.5}, 0);
                });
            }
            else {
                // Fallback
                const box = createBox(4, 4, 4, 0x64748b);
                scene.add(box); activeObjects.push(box);
                currentTimeline.to(box.rotation, {y: Math.PI, duration: 2});
            }
        }

        // ==========================================
        // 4. UI LOGIC & STATE MANAGEMENT
        // ==========================================
        let currentStepIndex = 0;
        let isPlaying = false;
        let autoPlayTimer = null;

        const domStepsContainer = document.getElementById('steps-container');
        const domInput = document.getElementById('info-input');
        const domOutput = document.getElementById('info-output');
        const domCode = document.getElementById('info-code');
        const domMath = document.getElementById('info-math');
        const domVizLabel = document.getElementById('viz-label');
        const speedSlider = document.getElementById('speed-slider');
        const btnPlay = document.getElementById('btn-play');

        function initUI() {
            // Build Sidebar
            pipelineSteps.forEach((step, idx) => {
                const el = document.createElement('div');
                el.className = `step-item px-4 py-3 border-b border-white/5 cursor-pointer hover:bg-white/5 transition-colors`;
                el.innerHTML = `
                    <div class="text-xs text-sky-400 font-bold mb-1">STEP ${idx + 1}</div>
                    <div class="text-sm font-medium">${step.title}</div>
                `;
                el.onclick = () => loadStep(idx);
                domStepsContainer.appendChild(el);
            });
            
            // Listeners
            document.getElementById('btn-next').onclick = () => { stopAutoPlay(); loadStep(currentStepIndex + 1); };
            document.getElementById('btn-prev').onclick = () => { stopAutoPlay(); loadStep(currentStepIndex - 1); };
            btnPlay.onclick = togglePlay;
            speedSlider.oninput = (e) => { 
                animationSpeed = parseFloat(e.target.value);
                if(currentTimeline) currentTimeline.timeScale(animationSpeed);
            };

            loadStep(0);
        }

        function loadStep(index) {
            if (index < 0 || index >= pipelineSteps.length) return;
            currentStepIndex = index;
            const step = pipelineSteps[index];

            // Update Sidebar Highlights
            Array.from(domStepsContainer.children).forEach((el, i) => {
                if (i === index) el.classList.add('active');
                else el.classList.remove('active');
            });
            // scroll into view smoothly
            domStepsContainer.children[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            // Update Text Panels
            domInput.textContent = step.input;
            domOutput.textContent = step.output;
            domCode.innerHTML = step.code.replace(/\n/g, '<br>');
            domVizLabel.textContent = `[Step ${step.id}] ${step.title}: ${step.desc}`;
            
            // MathJax Update
            domMath.innerHTML = step.math;
            MathJax.typesetPromise([domMath]).catch((err) => console.log(err));

            // Trigger 3D Animation
            runAnimation(step);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                btnPlay.innerHTML = '<i class="fa-solid fa-pause"></i>';
                btnPlay.classList.add('text-amber-400');
                btnPlay.classList.remove('text-sky-400');
                startAutoPlay();
            } else {
                btnPlay.innerHTML = '<i class="fa-solid fa-play"></i>';
                btnPlay.classList.remove('text-amber-400');
                btnPlay.classList.add('text-sky-400');
                stopAutoPlay();
            }
        }

        function startAutoPlay() {
            const stepDuration = (2500 / animationSpeed); // base time per step
            autoPlayTimer = setInterval(() => {
                if (currentStepIndex < pipelineSteps.length - 1) {
                    loadStep(currentStepIndex + 1);
                } else {
                    togglePlay(); // stop at end
                }
            }, stepDuration);
        }

        function stopAutoPlay() {
            clearInterval(autoPlayTimer);
            isPlaying = false;
            btnPlay.innerHTML = '<i class="fa-solid fa-play"></i>';
            btnPlay.classList.remove('text-amber-400');
            btnPlay.classList.add('text-sky-400');
        }

        // Boot
        window.onload = initUI;

    </script>
</body>
</html>
